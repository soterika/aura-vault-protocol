# .github/dependabot.yml
#
# Automated dependency update configuration.
# Closes #948, #1248
#
# Update strategy:
#   - Patch & Minor updates → grouped by ecosystem where configured, auto-merged/reviewed
#   - Major updates         → opened as separate PRs for manual review (potential breaking changes)
#
# PR title format follows Conventional Commits:
#   chore(deps): bump <package> from <old> to <new>

version: 2

updates:
  # ── npm — root ────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - devops
    labels:
      - dependencies
      - automated
      - javascript
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      npm-root-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── npm — backend ─────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - devops
    labels:
      - dependencies
      - automated
      - javascript
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      express-ecosystem:
        patterns:
          - "express"
          - "@types/express"
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - minor
          - patch

  # ── npm — frontend ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - devops
    labels:
      - dependencies
      - automated
      - javascript
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── npm — mobile ──────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - devops
    labels:
      - dependencies
      - automated
      - javascript
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      mobile-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── npm — contracts ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - devops
    labels:
      - dependencies
      - automated
      - javascript
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      contracts-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── Rust crates — aura-vault ──────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /aura-vault
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - devops
    labels:
      - dependencies
      - automated
      - rust
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # Batch non-breaking Soroban SDK updates together
      soroban:
        patterns:
          - "soroban-sdk"
          - "soroban-sdk-macros"
        update-types:
          - minor
          - patch
      # Group proptest + proptest-derive together
      proptest:
        patterns:
          - "proptest"
          - "proptest-derive"
        update-types:
          - minor
          - patch
      # Group remaining Cargo minor/patch updates by ecosystem to avoid PR flood
      cargo-ecosystem:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── Rust crates — aura-factory ────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /aura-factory
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - devops
    labels:
      - dependencies
      - automated
      - rust
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      soroban:
        patterns:
          - "soroban-sdk"
          - "soroban-sdk-macros"
        update-types:
          - minor
          - patch
      cargo-ecosystem:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── Rust crates — aura-migration ──────────────────────────────────────────
  - package-ecosystem: cargo
    directory: /aura-migration
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - devops
    labels:
      - dependencies
      - automated
      - rust
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      soroban:
        patterns:
          - "soroban-sdk"
          - "soroban-sdk-macros"
        update-types:
          - minor
          - patch
      cargo-ecosystem:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    reviewers:
      - devops
    labels:
      - dependencies
      - automated
      - github-actions
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
