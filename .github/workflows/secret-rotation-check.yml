name: Secret Rotation Age Check

on:
  schedule:
    # Run on the 1st of every month at 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Maximum allowed secret age in days before alerting'
        required: false
        default: '90'

permissions:
  id-token: write
  contents: read

jobs:
  check-secret-age:
    name: Check AWS Secrets Manager Secret Ages
    runs-on: ubuntu-latest
    env:
      MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '90' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

    steps:
      - name: Configure AWS credentials
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check secret rotation ages
        id: check_ages
        run: |
          set -euo pipefail
          SECRETS=(
            "aura-vault/dev/app"
            "aura-vault/dev/database/master"
            "aura-vault/staging/app"
            "aura-vault/staging/database/master"
            "aura-vault/prod/app"
            "aura-vault/prod/database/master"
          )

          NOW_EPOCH=$(date +%s)
          THRESHOLD_SECONDS=$((MAX_AGE_DAYS * 86400))
          OVERDUE_SECRETS=""

          for SECRET_ID in "${SECRETS[@]}"; do
            if ! LAST_ROTATED=$(aws secretsmanager describe-secret \
              --secret-id "$SECRET_ID" \
              --query 'LastRotatedDate || LastChangedDate' \
              --output text 2>/dev/null); then
              echo "Skipping $SECRET_ID (not found or inaccessible)"
              continue
            fi

            if [[ "$LAST_ROTATED" == "None" || -z "$LAST_ROTATED" ]]; then
              OVERDUE_SECRETS="${OVERDUE_SECRETS}\n- \`${SECRET_ID}\`: never rotated"
              continue
            fi

            ROTATED_EPOCH=$(date -d "$LAST_ROTATED" +%s)
            AGE_SECONDS=$((NOW_EPOCH - ROTATED_EPOCH))
            AGE_DAYS=$((AGE_SECONDS / 86400))

            echo "$SECRET_ID: last rotated ${AGE_DAYS} days ago"
            if (( AGE_SECONDS > THRESHOLD_SECONDS )); then
              OVERDUE_SECRETS="${OVERDUE_SECRETS}\n- \`${SECRET_ID}\`: ${AGE_DAYS} days old (threshold: ${MAX_AGE_DAYS}d)"
            fi
          done

          if [[ -n "$OVERDUE_SECRETS" ]]; then
            echo "has_overdue=true" >> "$GITHUB_OUTPUT"
            {
              echo "overdue_list<<EOF"
              echo -e "$OVERDUE_SECRETS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_overdue=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack on overdue secrets
        if: steps.check_ages.outputs.has_overdue == 'true' && secrets.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OVERDUE_LIST: ${{ steps.check_ages.outputs.overdue_list }}
        run: |
          PAYLOAD=$(jq -n \
            --arg text ":warning: *Aura Vault Secret Rotation Alert* — The following secrets exceed ${MAX_AGE_DAYS} days since last rotation:${OVERDUE_LIST}" \
            '{text: $text}')
          curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
