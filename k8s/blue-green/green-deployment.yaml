# Green deployment — the "standby" slot.
# CI always deploys the new image here first. The stable Service selector
# is flipped to slot=green only after smoke tests pass.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: aura-vault-green
  namespace: aura-vault
  labels:
    app: aura-vault
    slot: green
    component: app
  annotations:
    deployment.kubernetes.io/revision: "1"
    blue-green/slot: green

spec:
  replicas: 3
  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: aura-vault
      slot: green

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: aura-vault
        slot: green
        component: app
        version: "REPLACE_IMAGE_TAG"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: backend

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - aura-vault
                topologyKey: kubernetes.io/hostname

      containers:
        - name: backend
          image: aura-vault-backend:v2
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
            - name: metrics
              containerPort: 3001
              protocol: TCP

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets

          env:
            - name: DEPLOYMENT_SLOT
              value: green

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache

      volumes:
        - name: tmp
          emptyDir: {}

        - name: cache
          emptyDir:
            sizeLimit: 1Gi