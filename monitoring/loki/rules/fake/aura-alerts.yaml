groups:
  - name: aura-vault-log-alerts
    interval: 1m
    rules:
      - alert: AuraRouteErrorRateSpike
        expr: sum by (route) (count_over_time({service="aura-vault-backend", level=~"error|fatal"} | json | label_format route="{{.req_url}}" [1m])) > 10
        for: 1m
        labels:
          severity: warning
          priority: P2
        annotations:
          summary: "Backend error spike on {{ $labels.route }}"
          description: "More than 10 error log lines were emitted for this route in one minute."

      - alert: AuraAuthenticationFailureSpike
        expr: sum(count_over_time({service="aura-vault-backend"} |= "INVALID_TOKEN" [1m])) > 20
        for: 1m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Authentication failures spiked"
          description: "More than 20 INVALID_TOKEN events were logged in one minute."

      - alert: AuraDatabaseConnectionRefused
        expr: sum(count_over_time({service="aura-vault-backend"} |~ "(?i)(pg|postgres).*(ECONNREFUSED|connection refused)" [1m])) > 0
        for: 0m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Database connection refused"
          description: "A backend log reports a refused PostgreSQL connection."

      - alert: AuraHorizonTimeoutSpike
        expr: sum(count_over_time({service="aura-vault-backend"} |~ "(?i)horizon.*(timeout|timed out)" [5m])) > 5
        for: 1m
        labels:
          severity: warning
          priority: P2
        annotations:
          summary: "Horizon timeouts increased"
          description: "More than five Horizon timeout events were logged in five minutes."

      - alert: AuraBullMQJobFailureSpike
        expr: sum(count_over_time({service="aura-vault-backend"} |~ "(?i)(bullmq|job).*(failed|failure)" [1m])) > 5
        for: 1m
        labels:
          severity: warning
          priority: P2
        annotations:
          summary: "BullMQ job failures increased"
          description: "More than five BullMQ job failure events were logged in one minute."
