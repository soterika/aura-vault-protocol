groups:
  - name: ssl-certificate-expiry
    rules:
      # Warning: certificate expires in less than 30 days
      - alert: SslCertExpiryWarning
        expr: ssl_cert_expiry_days < 30 and ssl_cert_expiry_days >= 7
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon for {{ $labels.domain }}"
          description: >
            The SSL certificate for {{ $labels.domain }} expires in
            {{ $value | humanize }} days. Renew it before it expires.

      # Critical: certificate expires in less than 7 days
      - alert: SslCertExpiryCritical
        expr: ssl_cert_expiry_days < 7 and ssl_cert_expiry_days >= 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL — SSL certificate expiring in < 7 days for {{ $labels.domain }}"
          description: >
            The SSL certificate for {{ $labels.domain }} expires in only
            {{ $value | humanize }} days. Immediate renewal required.

      # Critical: certificate has already expired
      - alert: SslCertExpired
        expr: ssl_cert_expiry_days < 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SSL certificate EXPIRED for {{ $labels.domain }}"
          description: >
            The SSL certificate for {{ $labels.domain }} has expired
            ({{ $value | humanize }} days ago). All HTTPS connections will fail.

      # Warning: certificate check itself failed (connectivity / DNS issue)
      - alert: SslCertCheckFailed
        expr: ssl_cert_expiry_days == -1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate check failed for {{ $labels.domain }}"
          description: >
            Unable to connect to {{ $labels.domain }} to check its SSL certificate.
            This may indicate a DNS resolution failure, network issue, or the
            service being unreachable.
