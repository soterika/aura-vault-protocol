[package]
name = "aura-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "28", default-features = true }

[dev-dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }
proptest = "1"

[package.metadata.kani.flags]
default-unwind = "1"

[workspace]
members = [
    ".",
    "verification",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
